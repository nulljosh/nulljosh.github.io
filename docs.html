<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Docs, Joshua Trommel</title>
<meta name="description" content="How every project is built: what each file does and how the whole thing runs.">
<link rel="icon" type="image/svg+xml" href="pwa/favicon.svg">
<link rel="canonical" href="https://heyitsmejosh.com/docs">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="tokens.css?v=20260911">
<link rel="stylesheet" href="tokens-lovefrom.css?v=20260913">
<script>
const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;
</script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font-body);letter-spacing:var(--tracking);font-size:.9375rem;line-height:1.7;background:var(--color-bg);color:var(--color-text);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;}
a{color:inherit;text-decoration-color:var(--color-underline);text-underline-offset:3px;}
a:hover{text-decoration-color:var(--color-underline-hover);}
.wrap{max-width:62rem;margin:0 auto;padding:4rem 1.25rem 6rem;display:grid;grid-template-columns:11rem minmax(0,1fr);gap:3rem;}
nav{position:sticky;top:2rem;align-self:start;max-height:calc(100vh - 4rem);overflow-y:auto;font-size:.875rem;}
nav .home{display:block;margin-bottom:1.25rem;color:var(--color-secondary);}
nav a.repo{display:block;padding:.15rem 0;text-decoration:none;color:var(--color-secondary);}
nav a.repo[aria-current]{color:var(--color-text);font-weight:600;}
article{min-width:0;overflow-wrap:anywhere;}
article h1{font-size:1.75rem;line-height:1.2;margin-bottom:1rem;}
article h2{font-size:1.15rem;margin:2.25rem 0 .6rem;padding-top:1.25rem;border-top:1px solid var(--color-hairline);}
article h3{font-size:1rem;margin:1.5rem 0 .4rem;}
article p,article ul,article ol{margin-bottom:.9rem;}
article ul,article ol{padding-left:1.25rem;}
article code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;background:var(--color-code-bg);padding:.1em .3em;border-radius:4px;}
article pre{background:var(--color-code-bg);padding:.9rem;border-radius:8px;overflow-x:auto;margin-bottom:1rem;}
article pre code{background:none;padding:0;}
.table{overflow-x:auto;margin-bottom:1.25rem;}
article table{border-collapse:collapse;width:100%;font-size:.875rem;}
article th,article td{text-align:left;vertical-align:top;padding:.5rem .75rem .5rem 0;border-bottom:1px solid var(--color-hairline);}
article th{color:var(--color-secondary);font-weight:600;}
article td:first-child{white-space:nowrap;}
.src{margin-top:3rem;color:var(--color-secondary);font-size:.8125rem;}
@media (max-width:720px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:1.5rem;padding-top:2rem;}
  nav{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:.25rem .9rem;}
  nav .home{width:100%;margin-bottom:.25rem;}
  article td:first-child{white-space:normal;}
}
</style>
</head>
<body>
<div class="wrap">
  <nav aria-label="Projects"><a class="home" href="/">Joshua Trommel</a></nav>
  <article id="doc"><h1>Docs</h1><p>How every project is built: what each file does and how the whole thing runs. Pick a project.</p></article>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
const nav = document.querySelector('nav'), doc = document.getElementById('doc'), intro = doc.innerHTML;
let repos = [];
async function show() {
  const r = location.hash.slice(1);
  nav.querySelectorAll('a.repo').forEach(a => a.hash === '#' + r ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (!repos.includes(r)) { doc.innerHTML = intro; return; }
  const md = await fetch(`docs/${r}.md`).then(x => x.text());
  doc.innerHTML = DOMPurify.sanitize(marked.parse(md.replace(/^# Architecture/m, '# ' + r)));
  doc.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'table'; t.replaceWith(w); w.append(t); });
  doc.insertAdjacentHTML('beforeend', `<p class="src">Source: <a href="https://github.com/nulljosh/${r}/blob/main/docs/ARCHITECTURE.md">docs/ARCHITECTURE.md</a> in the ${r} repo.</p>`);
  document.title = `${r} docs, Joshua Trommel`;
  scrollTo(0, 0);
}
fetch('docs/index.json').then(x => x.json()).then(list => {
  repos = list;
  nav.insertAdjacentHTML('beforeend', list.map(r => `<a class="repo" href="#${r}">${r}</a>`).join(''));
  show();
});
addEventListener('hashchange', show);
</script>
</body>
</html>
